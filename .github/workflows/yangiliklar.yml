# Yangiliklar bot GitHub serverlarida: kompyuter o'chiq bo'lsa ham ishlaydi.
# - jadval: Toshkent vaqti bilan har 2 soatda, 08:00 dan 24:00 gacha. GitHub'ning o'z cron'i soatlab kechikib,
#   runlarni tashlab yuborgani uchun Cloudflare Worker cron'i workflow_dispatch (jadval=1) bilan ishga tushiradi
# - workflow_dispatch: Telegram'dagi tugma bosilganda Cloudflare Worker ishga tushiradi (cloudflare-worker/worker.js)
name: Yangiliklar
run-name: ${{ github.event.inputs.jadval == '1' && 'Yangiliklar (jadval)' || 'Yangiliklar' }}

on:
  workflow_dispatch:
    inputs:
      jadval:
        description: "1 = jadval bo'yicha oddiy run (Cloudflare cron)"
        required: false
        default: ""
      wait_id:
        description: "Tugma bosilganda yuborilgan ⏳ xabar ID si"
        required: false
        default: ""
      wait_chat:
        description: "⏳ xabar turgan chat (shaxsiy chat yoki guruh)"
        required: false
        default: ""
      mavzu:
        description: "Mavzu buyrug'i: ai yoki ilm (bo'sh bo'lsa umumiy yangiliklar)"
        required: false
        default: ""

# Bir vaqtda bitta ish: holat.json ikki marta yozilmasin, bir yangilik ikki marta kelmasin
concurrency:
  group: yangiliklar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yuborish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Yangiliklarni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT: ${{ github.event_name }}
          WAIT_ID: ${{ github.event.inputs.wait_id }}
          WAIT_CHAT: ${{ github.event.inputs.wait_chat }}
          MAVZU: ${{ github.event.inputs.mavzu }}
          JADVAL: ${{ github.event.inputs.jadval }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$JADVAL" != "1" ]; then
            python bot.py --tugma "$WAIT_ID" "$WAIT_CHAT" "$MAVZU"
          else
            python bot.py
          fi
      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "yangiliklar-bot"
          git config user.email "yangiliklar-bot@users.noreply.github.com"
          git add holat.json
          git diff --cached --quiet || { git commit -q -m "holat yangilandi" && git pull -q --rebase && git push -q; }

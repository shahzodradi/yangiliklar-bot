name: video sinov (vaqtinchalik)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          cd instagram && python -c "
          import logging,sys,pathlib; logging.basicConfig(level=logging.INFO,format='%(message)s',stream=sys.stdout)
          import video
          x={'title':'Nvidia','orig_title':'Nvidia halts server shipments to Malaysia, Singapore, Thailand, and Indonesia','link':'https://example.com','videos':[['https://x.com/nothing/status/2125590327189021093','X']],'title':'Nothing Phone','orig_title':'Nothing phone launch'}
          print(video.find_clips(x,set(),pathlib.Path('.'),'t',n=1))"
